services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn gorm_ai.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://gorm:gorm@db:5432/gorm_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    group_add:
      - "124"  # docker group GID — grants access to /var/run/docker.sock
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./log:/app/log
      - ./models:/app/models:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Reads simultaneous_tasks from DB config and starts with matching concurrency.
    # Uses prefork pool when concurrency > 1, solo pool for concurrency = 1.
    command: python -m gorm_ai.tasks.worker_entrypoint
    environment:
      - DATABASE_URL=postgresql+asyncpg://gorm:gorm@db:5432/gorm_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Limit PyTorch/NumPy/OpenBLAS thread pools so they don't consume all cores.
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - WORKER_NAME=${WORKER_NAME:-local}
    volumes:
      - ./src:/app/src
      - ./log:/app/log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.from_url('redis://redis:6379/1'); assert r.ping()\" && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_USER=gorm
      - POSTGRES_PASSWORD=gorm
      - POSTGRES_DB=gorm_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorm -d gorm_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://gorm:gorm@db:5432/gorm_ai
      - BACKEND_INTERNAL_URL=http://app:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=a9cf5f42678745af6c721227d3b9d37d981fa9fed6d01053b8123ff81f8da58c
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
      - LOG_LEVEL=info
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app               # entire source tree — changes hot-reload instantly
      - frontend_nm:/app/node_modules # named volume keeps installed packages off the host
      - frontend_next:/app/.next      # named volume keeps build cache off the host
      - ./log:/app/../log             # shared log dir with backend
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_nm:
  frontend_next:
