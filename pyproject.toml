[project]
name = "crypto-ai"
version = "0.1.0"
description = "Time series prediction system with pluggable prediction engines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pymysql>=1.1.2",
    "structlog>=25.5.0",
    "psutil>=7.1.3",
    "nvidia-ml-py3>=7.352.0",
    "docker>=7.1.0",
    "anthropic>=0.42.0",
    "aiofiles>=23.2.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
ml = [
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "torch>=2.0.0",
    "nvidia-cusparselt-cu12>=0.6",
]
timesfm = [
    "timesfm[xreg] @ git+https://github.com/google-research/timesfm.git",
]
# YingLong/Sundial require transformers>=4.57.6, which conflicts with FlowState.
yinglong = [
    "transformers>=4.57.6",
]
autogluon = [
    "autogluon.timeseries>=1.2.0",
]
# Chronos-2 (real amazon/chronos-2) requires the 2.x pipeline line.
chronos = [
    "chronos-forecasting>=2.2.0",
]
toto = [
    "toto-ts",
]
# Toto 2.0 (Datadog): separate package/distribution from toto-ts (Toto 1.0).
# Installs the `toto2` import. Requires Python 3.12+. Install in its own worker.
toto2 = [
    # toto-models requires Python >=3.12; gate it so the lock still resolves on
    # the 3.11 base image. A toto2 worker must run a 3.12 image to get it.
    "toto-models; python_version >= '3.12'",
]
# TabPFN-TS (Prior Labs) — LOCAL-ONLY. The local `tabpfn` package is mandatory
# so the engine never falls back to the cloud client. Install in its own worker.
tabpfn = [
    "tabpfn-time-series",
    "tabpfn>=6.0.6",
]
# MOIRAI-2 (Salesforce): cannot coexist with autogluon-timeseries due to
# gluonts version conflict (uni2ts needs ~=0.14.3, autogluon needs >=0.15).
moirai = [
    "uni2ts>=2.0.0",
    "scikit-learn>=1.4.0",
    "nvidia-cusparselt-cu12>=0.7",
]
kairos = [
    "kairos @ git+https://github.com/foundation-model-research/Kairos",
]
tirex = [
    "tirex-ts",
]
# FlowState (IBM): requires transformers<4.51 via granite-tsfm, conflicts with yinglong extra.
flowstate = [
    "granite-tsfm @ git+https://github.com/ibm-granite/granite-tsfm@gift-flowstate",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "aiosqlite>=0.19.0",
    # watchmedo: auto-restart the Celery worker on source changes in dev
    # (Celery prefork/solo workers do not hot-reload edited modules).
    "watchdog>=4.0.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "autogluon" },
        { extra = "moirai" },
        { extra = "kairos" },
        { extra = "toto" },
    ],
    [
        { extra = "flowstate" },
        { extra = "yinglong" },
    ],
    [
        { extra = "flowstate" },
        { extra = "kairos" },
    ],
    [
        { extra = "flowstate" },
        { extra = "autogluon" },
    ],
    [
        { extra = "toto" },
        { extra = "yinglong" },
    ],
    [
        { extra = "toto" },
        { extra = "flowstate" },
    ],
    [
        { extra = "tabpfn" },
        { extra = "flowstate" },
    ],
    [
        { extra = "tabpfn" },
        { extra = "toto" },
    ],
    [
        { extra = "tabpfn" },
        { extra = "autogluon" },
    ],
    [
        { extra = "tabpfn" },
        { extra = "moirai" },
    ],
    [
        { extra = "tabpfn" },
        { extra = "yinglong" },
    ],
    [
        { extra = "tabpfn" },
        { extra = "kairos" },
    ],
    [
        { extra = "toto2" },
        { extra = "moirai" },
    ],
    [
        { extra = "toto2" },
        { extra = "autogluon" },
    ],
    [
        { extra = "toto2" },
        { extra = "toto" },
    ],
    [
        { extra = "toto2" },
        { extra = "kairos" },
    ],
    [
        { extra = "toto2" },
        { extra = "flowstate" },
    ],
    [
        { extra = "toto2" },
        { extra = "yinglong" },
    ],
    [
        { extra = "toto2" },
        { extra = "tabpfn" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
