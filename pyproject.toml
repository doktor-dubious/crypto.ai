[project]
name = "gorm-ai"
version = "0.1.0"
description = "Time series prediction system with pluggable prediction engines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pymysql>=1.1.2",
    "structlog>=25.5.0",
    "psutil>=7.1.3",
    "docker>=7.1.0",
]

[project.optional-dependencies]
ml = [
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "torch>=2.0.0",
    "timesfm @ git+https://github.com/google-research/timesfm.git",
]
autogluon = [
    "autogluon.timeseries>=1.2.0",
]
# MOIRAI-2 (Salesforce/moirai-2.0-R-small via uni2ts) is implemented in
# src/gorm_ai/prediction/engines/moirai2_engine.py and registered as "moirai2",
# but cannot be installed alongside autogluon-timeseries:
#   uni2ts requires gluonts~=0.14.3  (<0.15)
#   autogluon-timeseries>=1.2 requires gluonts>=0.15,<0.17
# Re-enable once Salesforce updates their gluonts dependency in uni2ts.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "aiosqlite>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gorm_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
