[project]
name = "gorm-ai"
version = "0.1.0"
description = "Time series prediction system with pluggable prediction engines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pymysql>=1.1.2",
    "structlog>=25.5.0",
    "psutil>=7.1.3",
    "docker>=7.1.0",
    "anthropic>=0.42.0",
]

[project.optional-dependencies]
ml = [
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "torch>=2.0.0",
]
timesfm = [
    "timesfm @ git+https://github.com/google-research/timesfm.git",
]
# YingLong/Sundial require transformers>=4.57.6, which conflicts with FlowState.
yinglong = [
    "transformers>=4.57.6",
]
autogluon = [
    "autogluon.timeseries>=1.2.0",
]
chronos = [
    "chronos-forecasting>=1.4.0",
]
# MOIRAI-2 (Salesforce): cannot coexist with autogluon-timeseries due to
# gluonts version conflict (uni2ts needs ~=0.14.3, autogluon needs >=0.15).
moirai = [
    "uni2ts>=2.0.0",
]
kairos = [
    "kairos @ git+https://github.com/foundation-model-research/Kairos",
]
tirex = [
    "tirex-ts",
]
# FlowState (IBM): requires transformers<4.51 via granite-tsfm, conflicts with yinglong extra.
flowstate = [
    "granite-tsfm @ git+https://github.com/ibm-granite/granite-tsfm@gift-flowstate",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "aiosqlite>=0.19.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "autogluon" },
        { extra = "moirai" },
    ],
    [
        { extra = "flowstate" },
        { extra = "yinglong" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gorm_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
