## Production frontend — built as standalone Next.js, served on port 3010.
## Backend services (app, celery-worker, db, redis) come from docker-compose.yml.
##
## Usage:
##   docker build --network=host -f frontend/Dockerfile --target runner \
##     --build-arg NEXT_PUBLIC_APP_URL=https://gorm.predictioninstitute.com \
##     --build-arg BETTER_AUTH_URL=https://gorm.predictioninstitute.com \
##     -t gormai-frontend-prod frontend/
##   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d frontend-prod

services:
  frontend-prod:
    image: gormai-frontend-prod:latest
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gorm:gorm@db:5432/gorm_ai
      - BACKEND_INTERNAL_URL=http://app:8000
      - NEXT_PUBLIC_APP_URL=https://gorm.predictioninstitute.com
      - BETTER_AUTH_URL=https://gorm.predictioninstitute.com
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-a9cf5f42678745af6c721227d3b9d37d981fa9fed6d01053b8123ff81f8da58c}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
